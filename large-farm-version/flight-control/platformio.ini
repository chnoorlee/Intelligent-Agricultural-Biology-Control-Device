; PlatformIO Project Configuration File
; Bird Deterrent Fixed-Wing UAV Flight Controller
; Target: ESP32 / STM32F405

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    madgwick/MadgwickAHRS@^1.2.0
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit MPU6050@^2.2.0
    adafruit/Adafruit BMP280 Library@^2.6.1
    adafruit/Adafruit Unified Sensor@^1.1.13
    mavlink/MAVLink@^1.0.12

[env:stm32f405]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
lib_deps =
    madgwick/MadgwickAHRS@^1.2.0
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit MPU6050@^2.2.0
    adafruit/Adafruit BMP280 Library@^2.6.1
    adafruit/Adafruit Unified Sensor@^1.1.13
    mavlink/MAVLink@^1.0.12

build_flags =
    -D BOARD_STM32F405
    -D HAL_ADC_MODULE_ENABLED
    -D HAL_TIM_MODULE_ENABLED
